<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeApp - Campus IIPEA</title>
    <meta name="description" content="WeApp - Réseau social exclusif pour les étudiants de l'IIPEA">

    <!-- Polices & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔝 BARRE SUPÉRIEURE -->
    <header class="top-bar">
        <div class="logo-weapp">WeApp</div>

        <div class="search-box">
            <input type="text" id="searchInp" placeholder="Rechercher un étudiant...">
        </div>

        <div class="nav-icons-top">
            <button class="btn-icon" title="Messages Privés">💬</button>
        </div>
    </header>

    <!-- 📌 NAVIGATION (Cachée si non connecté) -->
    <nav class="main-nav hidden" id="nav-principale">
        <div class="nav-item active" id="tab-accueil">🏠 <span>Accueil</span></div>
        <div class="nav-item" id="tab-amis">👥 <span>Amis</span></div>
        <div class="nav-item" id="tab-notifs">🔔 <span>Notifications</span></div>
    </nav>

    <main class="container">

        <!-- 🔐 SECTION CONNEXION -->
        <section id="login-section" class="card">
            <div class="card-header">
                <h1>Connexion</h1>
                <p>Heureux de vous revoir sur le réseau IIPEA</p>
            </div>

            <div class="form-container">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="votre-email@exemple.com">
                </div>

                <div class="input-group">
                    <label for="loginPass">Mot de passe</label>
                    <input type="password" id="loginPass" placeholder="••••••••">
                </div>

                <button id="btn-connexion" class="btn-main">Se connecter</button>
            </div>

            <p class="switch-auth">
                Pas encore de compte ? <span id="go-register">Créer un compte</span>
            </p>
        </section>

        <!-- 📝 SECTION INSCRIPTION -->
        <section id="auth-section" class="card hidden">
            <div class="card-header">
                <h1>Inscription</h1>
                <p>Rejoignez la communauté étudiante</p>
            </div>

            <div class="form-container">
                <div class="input-group">
                    <input type="text" id="nom" placeholder="Nom complet (ex: Marc Williams)">
                    <input type="text" id="classe" placeholder="Classe (ex: L3 SEG)">
                    <input type="text" id="filiere" placeholder="Filière (ex: Administration des Affaires)">
                    <textarea id="bio" placeholder="Parlez-nous de vous en quelques mots..."></textarea>
                    <input type="email" id="email" placeholder="Email">
                    <input type="password" id="password" placeholder="Créer un mot de passe">
                </div>

                <button id="btn-inscription" class="btn-main">S'inscrire</button>
            </div>

            <p class="switch-auth">
                Déjà membre ? <span id="go-login">Se connecter</span>
            </p>
        </section>

        <!-- 🏠 APPLICATION PRINCIPALE -->
        <section id="main-content" class="hidden">
            
            <!-- Profil utilisateur (S'injecte via JS) -->
            <div id="user-header-profile"></div>

            <!-- Zone de Publication -->
            <section id="publication-area" class="card">
                <textarea id="postInput" placeholder="Quoi de neuf sur le campus ?"></textarea>

                <div class="post-actions">
                    <label for="fileInput" class="icon-upload">
                        🖼️ Photo / Vidéo
                    </label>
                    <input type="file" id="fileInput" hidden accept="image/*,video/*">

                    <button class="btn-post" id="btnPost">Publier</button>
                </div>
            </section>

            <!-- Fil d'actualité -->
            <div id="newsfeed"></div>

        </section>

    </main>

    <!-- Chargement du Script en mode Module -->
    <script type="module" src="script.js"></script>

</body>
</html>
