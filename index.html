<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeApp - Campus IIPEA</title>

    <!-- SEO basique -->
    <meta name="description" content="WeApp - Réseau social pour étudiants du campus IIPEA">

    <!-- Police -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔝 HEADER -->
    <header class="top-bar">
        <div class="logo-weapp">WeApp</div>

        <div class="search-box">
            <input 
                type="text" 
                id="searchInp" 
                placeholder="Rechercher un étudiant..." 
                aria-label="Rechercher un étudiant">
        </div>

        <div class="nav-icons-top">
            <button class="btn-icon" title="Messages Privés" aria-label="Messages">
                💬
            </button>
        </div>
    </header>

    <!-- 📌 NAVIGATION PRINCIPALE -->
    <nav class="main-nav hidden" id="nav-principale">
        <button class="nav-item active" data-tab="accueil">
            🏠 <span>Accueil</span>
        </button>

        <button class="nav-item" data-tab="amis">
            👥 <span>Amis</span>
        </button>

        <button class="nav-item" data-tab="notifs">
            🔔 <span>Notifications</span>
        </button>
    </nav>

    <!-- 📦 CONTENU -->
    <main class="container">

        <!-- 🔐 CONNEXION -->
        <section id="login-section" class="card">
            <div class="card-header">
                <h1>Connexion</h1>
                <p>Accède au réseau étudiant IIPEA</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="input-group">
                    <label for="loginPass">Mot de passe</label>
                    <input type="password" id="loginPass" required>
                </div>

                <button type="submit" class="btn-main">
                    Se connecter
                </button>
            </form>

            <p class="switch-auth">
                Pas de compte ?
                <span id="go-register">S'inscrire</span>
            </p>
        </section>

        <!-- 📝 INSCRIPTION -->
        <section id="auth-section" class="card hidden">
            <div class="card-header">
                <h1>Créer un compte</h1>
                <p>Rejoins la communauté WeApp</p>
            </div>

            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="nom" placeholder="Nom complet" required>
                    <input type="text" id="classe" placeholder="Classe (L2 SEG)">
                    <input type="text" id="filiere" placeholder="Filière">
                    <textarea id="bio" placeholder="Ta bio"></textarea>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn-main">
                    Créer mon compte
                </button>
            </form>

            <p class="switch-auth">
                Déjà inscrit ?
                <span id="go-login">Se connecter</span>
            </p>
        </section>

        <!-- 🏠 APP PRINCIPALE -->
        <section id="main-content" class="hidden">

            <!-- 👤 Profil -->
            <div id="user-header-profile"></div>

            <!-- ✍️ Publication -->
            <section id="publication-area" class="card">
                <textarea 
                    id="postInput" 
                    placeholder="Quoi de neuf sur le campus ?">
                </textarea>

                <div class="post-actions">
                    <label for="fileInput" class="icon-upload">
                        🖼️ Ajouter média
                    </label>

                    <input 
                        type="file" 
                        id="fileInput" 
                        hidden 
                        accept="image/*,video/*">

                    <button class="btn-post" id="btnPost">
                        Publier
                    </button>
                </div>
            </section>

            <!-- 📰 Fil -->
            <section id="newsfeed"></section>

        </section>

    </main>

    <!-- JS -->
    <script type="module" src="script.js"></script>

</body>
</html>
